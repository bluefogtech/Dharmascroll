
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DharmaScroll</title>
    
    <!-- PWA and iOS Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DharmaScroll">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3663/3663335.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a0b04; /* Deep Earthy Maroon */
            --accent-saffron: #ff9933; /* Saffron */
            --accent-gold: #ffcc33; /* Gold */
            --accent-kumkum: #e32636; /* Kumkum/Vermillion */
            --text-gold-light: #fde68a;
            --text-slate: #d1d5db;
            --text-white: #fffcf2; /* Creamy White */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: 'Lora', serif;
            color: var(--text-white);
            -webkit-tap-highlight-color: transparent;
        }

        .snap-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .snap-container::-webkit-scrollbar {
            display: none;
        }
        .snap-item {
            scroll-snap-align: start;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
            padding: calc(env(safe-area-inset-top, 0px) + 6rem) 2rem calc(env(safe-area-inset-bottom, 0px) + 2rem) 2rem;
            overflow: hidden;
        }

        .fullscreen-center {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            text-align: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .spinner {
            width: 3rem;
            height: 3rem;
            border: 4px solid rgba(255, 153, 51, 0.15);
            border-top: 4px solid var(--accent-saffron);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        .error-symbol {
            font-size: 5rem;
            color: var(--accent-gold);
            text-shadow: 0 0 20px rgba(255, 204, 51, 0.5);
            margin-bottom: 1.5rem;
            font-family: serif;
        }

        .btn-primary {
            background: var(--accent-kumkum);
            color: white;
            border: none;
            padding: 0.85rem 2.5rem;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(227, 38, 54, 0.3);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(227, 38, 54, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .quote-sanskrit {
            font-size: 1.15rem;
            color: var(--accent-gold);
            font-style: normal;
            margin-bottom: 1.25rem;
            line-height: 1.6;
            max-width: 100%;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .quote-main {
            font-size: 1.75rem;
            font-weight: 500;
            line-height: 1.35;
            margin-bottom: 2rem;
            font-style: italic;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            color: var(--text-white);
        }
        .quote-source {
            color: var(--accent-saffron);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-size: 1.05rem;
            margin-bottom: 0.4rem;
            font-weight: 600;
        }
        .quote-context {
            color: var(--text-gold-light);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.8;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 2rem;
        }
        .tag {
            padding: 0.3rem 0.9rem;
            background: rgba(255, 153, 51, 0.12);
            border: 1px solid rgba(255, 204, 51, 0.15);
            border-radius: 9999px;
            font-size: 0.65rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .action-bar {
            position: absolute;
            right: 1rem;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 6rem);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            z-index: 20;
        }
        .action-btn {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 153, 51, 0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--accent-saffron);
        }
        .action-btn:hover {
            background: rgba(255, 153, 51, 0.15);
            border-color: var(--accent-saffron);
        }
        .action-btn svg {
            width: 1.5rem;
            height: 1.5rem;
        }

        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.2;
            pointer-events: none;
        }

        .scroll-cue {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 2rem);
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.5;
            color: var(--accent-gold);
            animation: float 4s ease-in-out infinite;
        }

        .header-logo {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 1.25rem);
            left: 1.25rem;
            right: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            color: var(--accent-gold);
        }

        .version-tag {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 0.75rem);
            right: 1.5rem;
            font-family: monospace;
            font-size: 10px;
            color: rgba(255, 204, 51, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes float {
            0%, 100% { transform: translate(-50%, 0px); }
            50% { transform: translate(-50%, -10px); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.05); }
        }
        .animate-pulse { animation: pulse 6s ease-in-out infinite; }

        @media (min-width: 768px) {
            .quote-main { font-size: 2.5rem; max-width: 80%; }
            .snap-item { padding: 4rem; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "@stripe/stripe-js": "https://esm.sh/@stripe/stripe-js@^8.6.4"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
