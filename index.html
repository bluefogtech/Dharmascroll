<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DharmaScroll</title>
    
    <!-- PWA and iOS Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DharmaScroll">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a0b04">
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3663/3663335.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a0b04; 
            --accent-saffron: #ff9933; 
            --accent-gold: #ffcc33; 
            --accent-kumkum: #e32636; 
            --text-gold-light: #fde68a;
            --text-slate: #d1d5db;
            --text-white: #fffcf2; 
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: 'Lora', serif;
            color: var(--text-white);
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #root {
            height: 100%;
            width: 100%;
        }

        .snap-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
            height: 100dvh;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .snap-container::-webkit-scrollbar {
            display: none;
        }
        .snap-item {
            scroll-snap-align: start;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
        }

        .quote-content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            text-align: center;
            z-index: 10;
            width: 100%;
            box-sizing: border-box;
        }
        
        .quote-content-area > div {
            width: 100%;
            max-width: 36rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: 0 auto;
        }

        .quote-meta-overlay {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 100%;
            /* Increased bottom padding to push content above cues and safe area */
            padding: 0 1.5rem calc(env(safe-area-inset-bottom, 0px) + 5.5rem) 1.5rem;
            box-sizing: border-box;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            pointer-events: none;
            background: linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 100%);
        }
        
        .quote-meta-overlay > * {
            pointer-events: auto;
        }

        .fullscreen-center {
            height: 100vh;
            height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            text-align: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .spinner {
            width: 3rem; height: 3rem;
            border: 4px solid rgba(255, 153, 51, 0.15);
            border-top: 4px solid var(--accent-saffron);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        .btn-primary {
            background: var(--accent-kumkum);
            color: white; border: none;
            padding: 0.85rem 2.5rem;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(227, 38, 54, 0.3);
        }

        .quote-sanskrit {
            font-size: 1.1rem; 
            color: var(--accent-gold);
            margin-bottom: 1.25rem; 
            line-height: 1.6;
            max-width: 100%; 
            font-weight: 500;
            text-align: center;
            width: 100%;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .quote-main {
            font-size: 1.6rem; 
            font-weight: 500; 
            line-height: 1.4;
            margin-bottom: 1.5rem; 
            font-style: italic;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            color: var(--text-white);
            text-align: center;
            width: 100%;
            max-width: 100%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            margin-left: auto;
            margin-right: auto;
        }
        .quote-source {
            color: var(--accent-saffron);
            text-transform: uppercase; 
            letter-spacing: 0.12em;
            font-size: 0.9rem; 
            margin-bottom: 0.5rem; 
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            max-width: 95%;
            line-height: 1.4;
            white-space: normal;
            word-wrap: break-word;
            display: block;
            overflow: visible; /* Prevent truncation */
        }
        .quote-context {
            color: var(--text-gold-light);
            font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 0.08em; opacity: 0.9;
            margin-bottom: 0.8rem;
            max-width: 90%;
            line-height: 1.4;
        }

        .tag-container {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 0.4rem; margin-top: 0.5rem;
        }
        .tag {
            padding: 0.2rem 0.6rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 204, 51, 0.2);
            border-radius: 4px; font-size: 0.55rem;
            color: var(--accent-gold); text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-bar {
            position: absolute; right: 1rem;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 7rem);
            display: flex; flex-direction: column; gap: 1.5rem; z-index: 20;
        }
        .action-btn {
            width: 3rem; height: 3rem;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 153, 51, 0.2); border-radius: 50%;
            cursor: pointer; transition: all 0.2s; color: var(--accent-saffron);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .action-btn.liked {
            color: var(--accent-kumkum);
            border-color: var(--accent-kumkum);
            background: rgba(227, 38, 54, 0.15);
        }

        .action-btn.shared {
            color: var(--accent-gold);
            border-color: var(--accent-gold);
            background: rgba(255, 204, 51, 0.15);
        }

        .lang-picker {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 153, 51, 0.3);
            border-radius: 99px;
            padding: 3px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }
        .lang-option {
            padding: 0.4rem 0.8rem;
            border-radius: 99px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 50px;
            text-align: center;
        }
        .lang-option.active {
            background: var(--accent-saffron);
            color: white;
            box-shadow: 0 2px 8px rgba(255, 153, 51, 0.4);
        }

        .bg-blob {
            position: absolute; border-radius: 50%;
            filter: blur(80px); z-index: 0; opacity: 0.2; pointer-events: none;
        }

        .scroll-cue {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 1.2rem);
            left: 50%; transform: translateX(-50%);
            opacity: 0.4; color: var(--accent-gold);
            animation: float 4s ease-in-out infinite;
            pointer-events: none;
        }

        .header-logo {
            position: fixed; top: calc(env(safe-area-inset-top, 0px) + 1rem);
            left: 1rem; right: 1rem;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; color: var(--accent-gold);
            pointer-events: none;
        }

        .version-tag {
            position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 0.3rem);
            left: 1rem; font-family: monospace; font-size: 8px;
            color: rgba(255, 204, 51, 0.2); z-index: 50;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(15px);
            padding: 2rem;
            box-sizing: border-box;
            animation: fadeIn 0.3s ease-out;
        }

        .bottom-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(26, 11, 4, 0.98);
            border-top: 1px solid rgba(255, 153, 51, 0.3);
            border-radius: 24px 24px 0 0;
            padding: 2rem 1.5rem calc(env(safe-area-inset-bottom, 0px) + 2rem) 1.5rem;
            z-index: 2000;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(25px);
            animation: slideUp 0.4s cubic-bezier(0.33, 1, 0.68, 1);
        }

        .sheet-handle {
            width: 40px; height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin: -1rem auto 1.5rem auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translate(-50%, 0px); } 50% { transform: translate(-50%, -10px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (min-width: 768px) {
            .quote-content-area {
                padding: 3rem 4rem;
            }
            .quote-content-area > div {
                max-width: 42rem;
            }
            .quote-sanskrit { 
                font-size: 1.3rem; 
                max-width: 100%;
            }
            .quote-main { 
                font-size: 2.2rem; 
                max-width: 100%;
                line-height: 1.5;
            }
            .quote-meta-overlay { 
                padding: 0 4rem calc(env(safe-area-inset-bottom, 0px) + 5.5rem) 4rem; 
                max-width: 100%;
            }
        }
        
        @media (min-width: 1024px) {
            .quote-content-area > div {
                max-width: 48rem;
            }
            .quote-main {
                font-size: 2.4rem;
            }
        }
        
        @media (max-width: 480px) {
            .quote-content-area {
                padding: 1.5rem 1rem;
            }
            .quote-sanskrit {
                font-size: 1rem;
                margin-bottom: 1rem;
            }
            .quote-main {
                font-size: 1.4rem;
                margin-bottom: 1.25rem;
            }
        }
    </style>
