    <style>
        :root {
            /* Vibrant Hinduism-inspired color palette */
            --bg-dark: #1a0f0a; /* Deep rich dark with warm undertones */

            --accent-gold: #FFD700; /* Brilliant gold - knowledge, prosperity */
            --accent-kumkum: #FF1744; /* Vibrant red (Kumkum/Tilak) - power, auspiciousness */
            --accent-turmeric: #FFB84D; /* Bright turmeric - healing, purity */
            --accent-lotus: #FF6B9D; /* Vibrant lotus pink - beauty, enlightenment */
            --accent-krishna: #5C6BC0; /* Rich Krishna blue - divine, protection */
            --accent-forest: #2E7D32; /* Vibrant forest green - nature, life, prosperity */
            --accent-purple: #7B1FA2; /* Spiritual purple - meditation, wisdom */
            --text-gold-light: #FFE082; /* Bright light gold for text */
            --text-gold-brilliant: #FFC107; /* Brilliant gold */
            --text-saffron-light: #FF8A50; /* Bright saffron for accents */
            --text-white: #FFFFFF; /* Pure white for contrast */
            --text-cream: #FFF8E1; /* Soft cream for readability */
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0f0a 0%, #2d1a14 20%, #4a2c1a 40%, #6b3e26 60%, #4a2c1a 80%, #2d1a14 100%);
            background-attachment: fixed;
            overflow: hidden;
            font-family: 'Lora', serif;
            color: var(--text-white);
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #root {
            height: 100%;
            width: 100%;
        }

        .snap-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
            height: 100dvh;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        /* Desktop: fill parent so share + scroll-cue stay visible above version-tag */
        @media (min-width: 769px) {
            .snap-container {
                height: 100%;
            }
            .snap-item {
                height: 100%;
            }
        }
        .snap-container::-webkit-scrollbar {
            display: none;
        }
        .snap-item {
            scroll-snap-align: start;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
        }

        .quote-content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            padding-top: calc(2rem + 60px);
            padding-bottom: calc(2rem + 120px);
            text-align: center;
            z-index: 10;
            width: 100%;
            box-sizing: border-box;
            min-height: 0;
            overflow: hidden;
        }
        /* Desktop: allow action-bar and scroll-cue to appear above quote-content-area */
        @media (min-width: 769px) {
            .quote-content-area {
                overflow: visible;
            }
        }
        
        .quote-content-area > div {
            width: 100%;
            max-width: 36rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: 0 auto;
        }

        .quote-meta-overlay {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 5rem);
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 100%;
            padding: 0 1.5rem 1rem 1.5rem;
            box-sizing: border-box;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            pointer-events: none;
            background: transparent;
        }
        @media (max-width: 768px) {
            .quote-content-area {
                padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8rem) !important; /* 20% more card length toward bottom (was 10rem) */
            }
        }
        
        .quote-meta-overlay > * {
            pointer-events: auto;
        }

            height: 100vh;
            height: 100dvh;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
