<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DharmaScroll</title>
    
    <!-- PWA and iOS Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DharmaScroll">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3663/3663335.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020617;
            --accent-cyan: #0891b2;
            --accent-cyan-light: #22d3ee;
            --text-slate: #94a3b8;
            --text-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: 'Lora', serif;
            color: var(--text-white);
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .snap-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .snap-container::-webkit-scrollbar {
            display: none;
        }
        .snap-item {
            scroll-snap-align: start;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
            padding: 2rem;
            overflow: hidden;
        }

        /* Loading & Error Styles */
        .fullscreen-center {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            text-align: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .spinner {
            width: 3rem;
            height: 3rem;
            border: 4px solid rgba(8, 145, 178, 0.2);
            border-top: 4px solid var(--accent-cyan-light);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        .error-symbol {
            font-size: 4rem;
            color: #f59e0b;
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
            margin-bottom: 1.5rem;
        }

        .btn-primary {
            background: rgba(8, 145, 178, 0.4);
            color: white;
            border: 1px solid rgba(34, 211, 238, 0.3);
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: rgba(8, 145, 178, 0.6);
        }

        /* Typography */
        .quote-sanskrit {
            font-size: 1.25rem;
            color: rgba(34, 211, 238, 0.6);
            font-style: italic;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .quote-main {
            font-size: 2rem;
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 2rem;
            font-style: italic;
            text-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .quote-source {
            color: var(--accent-cyan-light);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 1.125rem;
            margin-bottom: 0.5rem;
        }
        .quote-context {
            color: var(--text-slate);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* Card Elements */
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }
        .tag {
            padding: 0.25rem 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            font-size: 0.75rem;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: -0.025em;
        }

        .action-bar {
            position: absolute;
            right: 1rem;
            bottom: 6rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 20;
        }
        .action-btn {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .action-btn svg {
            width: 1.5rem;
            height: 1.5rem;
            color: white;
        }

        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(64px);
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }

        .scroll-cue {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.3;
            animation: float 4s ease-in-out infinite;
        }

        .header-logo {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            right: 1.5rem;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 50;
            color: rgba(255, 255, 255, 0.2);
            font-size: 1.25rem;
            font-style: italic;
        }

        .version-tag {
            position: fixed;
            bottom: 0.5rem;
            right: 1rem;
            font-family: monospace;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            pointer-events: none;
            z-index: 50;
        }

        /* Animations */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes float {
            0%, 100% { transform: translate(-50%, 0px); }
            50% { transform: translate(-50%, -10px); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.4; }
        }
        .animate-pulse { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        @media (min-width: 768px) {
            .quote-main { font-size: 2.5rem; }
        }
    </style>

</head>

</body>
</html>
