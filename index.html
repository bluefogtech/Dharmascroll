
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DharmaScroll</title>
    
    <!-- PWA and iOS Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DharmaScroll">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a0b04">
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3663/3663335.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a0b04; 
            --accent-saffron: #ff9933; 
            --accent-gold: #ffcc33; 
            --accent-kumkum: #e32636; 
            --text-gold-light: #fde68a;
            --text-slate: #d1d5db;
            --text-white: #fffcf2; 
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: 'Lora', serif;
            color: var(--text-white);
            -webkit-tap-highlight-color: transparent;
            /* Prevent bounce scrolling on iOS */
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #root {
            height: 100%;
            width: 100%;
        }

        .snap-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
            height: 100dvh;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .snap-container::-webkit-scrollbar {
            display: none;
        }
        .snap-item {
            scroll-snap-align: start;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
            padding: calc(env(safe-area-inset-top, 0px) + 4rem) 2rem calc(env(safe-area-inset-bottom, 0px) + 2rem) 2rem;
            overflow: hidden;
        }

        .fullscreen-center {
            height: 100vh;
            height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            text-align: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .spinner {
            width: 3rem; height: 3rem;
            border: 4px solid rgba(255, 153, 51, 0.15);
            border-top: 4px solid var(--accent-saffron);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        .btn-primary {
            background: var(--accent-kumkum);
            color: white; border: none;
            padding: 0.85rem 2.5rem;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(227, 38, 54, 0.3);
        }

        .quote-sanskrit {
            font-size: 1.15rem; color: var(--accent-gold);
            margin-bottom: 1.25rem; line-height: 1.6;
            max-width: 100%; font-weight: 500;
        }
        .quote-main {
            font-size: 1.75rem; font-weight: 500; line-height: 1.35;
            margin-bottom: 2rem; font-style: italic;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            color: var(--text-white);
        }
        .quote-source {
            color: var(--accent-saffron);
            text-transform: uppercase; letter-spacing: 0.15em;
            font-size: 1.05rem; margin-bottom: 0.4rem; font-weight: 600;
        }
        .quote-context {
            color: var(--text-gold-light);
            font-size: 0.85rem; text-transform: uppercase;
            letter-spacing: 0.2em; opacity: 0.8;
        }

        .tag-container {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 0.6rem; margin-top: 2rem;
        }
        .tag {
            padding: 0.3rem 0.9rem;
            background: rgba(255, 153, 51, 0.12);
            border: 1px solid rgba(255, 204, 51, 0.15);
            border-radius: 9999px; font-size: 0.65rem;
            color: var(--accent-gold); text-transform: uppercase;
        }

        .action-bar {
            position: absolute; right: 1rem;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 6rem);
            display: flex; flex-direction: column; gap: 1.25rem; z-index: 20;
        }
        .action-btn {
            width: 3.2rem; height: 3.2rem;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 153, 51, 0.2); border-radius: 50%;
            cursor: pointer; transition: all 0.2s; color: var(--accent-saffron);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .action-btn.liked {
            color: var(--accent-kumkum);
            border-color: var(--accent-kumkum);
            background: rgba(227, 38, 54, 0.15);
        }

        .action-btn.shared {
            color: var(--accent-gold);
            border-color: var(--accent-gold);
            background: rgba(255, 204, 51, 0.15);
        }

        .heart-pop, .share-pop {
            animation: popEffect 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popEffect {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        .bg-blob {
            position: absolute; border-radius: 50%;
            filter: blur(80px); z-index: 0; opacity: 0.2; pointer-events: none;
        }

        .scroll-cue {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
            left: 50%; transform: translateX(-50%);
            opacity: 0.5; color: var(--accent-gold);
            animation: float 4s ease-in-out infinite;
        }

        .header-logo {
            position: fixed; top: calc(env(safe-area-inset-top, 0px) + 1.25rem);
            left: 1.25rem; right: 1.25rem;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; color: var(--accent-gold);
            pointer-events: none;
        }
        .header-logo button { pointer-events: auto; }

        .version-tag {
            position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 0.5rem);
            left: 1rem; font-family: monospace; font-size: 8px;
            color: rgba(255, 204, 51, 0.2); z-index: 50;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(20px);
            padding: 2rem;
            box-sizing: border-box;
            animation: fadeIn 0.3s ease-out;
        }

        .bottom-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(26, 11, 4, 0.98);
            border-top: 1px solid rgba(255, 153, 51, 0.3);
            border-radius: 24px 24px 0 0;
            padding: 2rem 1.5rem calc(env(safe-area-inset-bottom, 0px) + 2rem) 1.5rem;
            z-index: 2000;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(25px);
            animation: slideUp 0.4s cubic-bezier(0.33, 1, 0.68, 1);
        }

        .sheet-handle {
            width: 40px; height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin: -1rem auto 1.5rem auto;
        }

        /* Install Banner Customization */
        .install-guide {
          position: fixed;
          bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem);
          left: 1rem;
          right: 1rem;
          background: rgba(255, 153, 51, 0.95);
          color: white;
          padding: 1rem;
          border-radius: 16px;
          z-index: 3000;
          display: flex;
          align-items: center;
          gap: 1rem;
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
          animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translate(-50%, 0px); } 50% { transform: translate(-50%, -10px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (min-width: 768px) {
            .quote-main { font-size: 2.5rem; max-width: 80%; }
            .snap-item { padding: 4rem; }
        }
    </style>
<script type="importmap">

</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
